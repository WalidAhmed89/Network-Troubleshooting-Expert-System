<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 40" width="164" height="40" role="img" aria-label="NetPath">
  <!-- Node topology mark -->
  <line x1="20" y1="10" x2="9"  y2="30" stroke="#14b8a6" stroke-width="1.6" stroke-linecap="round" opacity="0.70"/>
  <line x1="20" y1="10" x2="31" y2="30" stroke="#14b8a6" stroke-width="1.6" stroke-linecap="round" opacity="0.70"/>
  <line x1="9"  y1="30" x2="31" y2="30" stroke="#14b8a6" stroke-width="1.6" stroke-linecap="round" opacity="0.70"/>
  <!-- Secondary nodes -->
  <circle cx="9"  cy="30" r="4.5" fill="#132633" stroke="#14b8a6" stroke-width="1.6"/>
  <circle cx="31" cy="30" r="4.5" fill="#132633" stroke="#14b8a6" stroke-width="1.6"/>
  <!-- Primary diagnostic node -->
  <circle cx="20" cy="10" r="7"   fill="#14b8a6"/>
  <circle cx="20" cy="10" r="3"   fill="#0c121e"/>
  <!-- Wordmark -->
  <text x="48" y="26"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="18" font-weight="800" letter-spacing="-0.6">
    <tspan fill="#f1f5f9">Net</tspan><tspan fill="#14b8a6">Path</tspan>
  </text>
</svg>
