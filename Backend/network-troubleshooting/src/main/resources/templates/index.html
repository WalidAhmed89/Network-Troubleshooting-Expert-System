
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Troubleshooting Expert System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        header {
            background: #12304a;
            color: white;
            padding: 22px 8%;
        }

        header h2 {
            margin: 0;
            font-size: 22px;
        }

        main {
            max-width: 900px;
            margin: 90px auto;
            padding: 24px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 48px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        h1 {
            color: #12304a;
            font-size: 36px;
            margin-bottom: 18px;
        }

        p {
            color: #64748b;
            line-height: 1.8;
            font-size: 17px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 26px;
            background: #1677c8;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .button:hover {
            background: #105fa1;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h2>Network Troubleshooting Expert System</h2>
</header>

<main>
    <section class="card">
        <h1>Network Diagnosis Made Simple</h1>

        <p>
            Identify possible network problems through a guided
            troubleshooting process powered by a rule-based expert system.
        </p>

        <a href="/diagnosis" class="button">
            Start Diagnosis
        </a>
    </section>
</main>

<footer>
    Network Troubleshooting Expert System
</footer>

</body>
</html>
